# clamd settings for the LINEAGE scan service. Mounted over /etc/clamav/clamd.conf in the clamav container.
# NOT TESTED in the build sandbox (no Docker there): check `docker compose logs clamav` on first start.
Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0
# The API streams uploads of up to MAX_UPLOAD_MB (500). clamd's default stream limit is far smaller and would refuse them.
StreamMaxLength 520M
MaxFileSize 520M
MaxScanSize 1024M
ReadTimeout 120
CommandReadTimeout 30
